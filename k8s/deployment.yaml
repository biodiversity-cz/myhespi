apiVersion: apps/v1
kind: Deployment
metadata:
  name: myhespi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myhespi
  template:
    metadata:
      labels:
        app: myhespi
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: myhespi
          image: ghcr.io/biodiversity-cz/myhespi:main
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8000
          env:
            - name: MYHESPI_API_TOKENS
              valueFrom:
                secretKeyRef:
                  name: myhespi-secrets
                  key: api-tokens
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: myhespi-secrets
                  key: openai-api-key
                  optional: true
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: myhespi-secrets
                  key: hf-token
                  optional: true
            - name: HESPI_USE_GPU
              value: "1"
            - name: HESPI_LLM_MODEL
              value: "none"
            - name: HESPI_TROCR_SIZE
              value: "small"
            - name: HESPI_BATCH_SIZE
              value: "16"
            - name: HESPI_SHEET_COMPONENT_RES
              value: "640"
            - name: HESPI_LABEL_FIELD_RES
              value: "640"
            # OpenAI-compatible LLM API (e.g. e-INFRA Chat AI). Leave empty for OpenAI default or LLM off.
            - name: HESPI_LLM_BASE_URL
              value: "https://llm.ai.e-infra.cz/v1"
            - name: MYHESPI_TEMP_ROOT
              value: "/app/myhespi-temp"
            - name: MYHESPI_MAX_UPLOAD_MB
              value: "5"
            - name: MYHESPI_PROCESS_TIMEOUT_SECONDS
              value: "300"
            - name: MYHESPI_RETENTION_DAYS
              value: "7"
          resources:
            requests:
              cpu: "500m"
              memory: "4Gi"
              nvidia.com/gpu: 1
            limits:
              cpu: "4"
              memory: "32Gi"
              nvidia.com/gpu: 1
          volumeMounts:
            - name: temp-data
              mountPath: /app/myhespi-temp
      volumes:
        - name: temp-data
          emptyDir: {}
